<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0060DF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#003882" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />

  <!-- Inner Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.18" />

  <!-- Center Emblem: Stylized K and Knowledge Torch -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Bold Letter K -->
    <path d="M 160 140 L 210 140 L 210 372 L 160 372 Z" fill="#FFFFFF"/>
    <path d="M 210 266 L 310 140 L 372 140 L 252 284 L 376 372 L 312 372 L 210 296 Z" fill="#FFFFFF"/>
  </g>

  <!-- Golden Star of Excellence -->
  <path d="M 370 140 L 378 158 L 398 160 L 382 174 L 388 194 L 370 182 L 352 194 L 358 174 L 342 160 L 362 158 Z" fill="url(#accent)" />
</svg>
